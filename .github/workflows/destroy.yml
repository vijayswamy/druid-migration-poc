name: Destroy Demo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm deleting all cloud resources'
        required: true

jobs:
  destroy:
    name: Destroy EKS + AKS + all resources
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Type 'destroy' to confirm. Aborting."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download Terraform state (from create job)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=terraform-state&per_page=1" \
            --jq '.artifacts[0] | select(.expired==false) | .id' 2>/dev/null || true)
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Found terraform-state artifact ID: $ARTIFACT_ID — restoring state"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/tf-state.zip
            unzip -o /tmp/tf-state.zip -d terraform/
            echo "Terraform state restored."
          else
            echo "ERROR: No terraform-state artifact found — cannot destroy without state."
            exit 1
          fi

      - name: Terraform destroy
        run: |
          cd terraform
          terraform init
          terraform destroy -auto-approve

      - name: Confirm everything is deleted
        run: |
          echo "--- Checking AWS ---"
          aws eks list-clusters --region us-east-1
          aws s3 ls | grep druid || echo "No druid S3 buckets found"
          echo "--- Checking Azure ---"
          az group list --query "[?name=='druid-poc-rg'].name" -o tsv || echo "No druid-poc-rg found"
          echo "================================================"
          echo " DESTROY COMPLETE — Zero cloud cost!"
          echo "================================================"
