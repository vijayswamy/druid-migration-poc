# PostgreSQL Helm values — same config used on both EKS and AKS
auth:
  postgresPassword: YOUR_DB_PASSWORD
  database: druid_metadata

primary:
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
