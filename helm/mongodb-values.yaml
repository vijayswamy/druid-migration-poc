# MongoDB Helm values — same config used on both EKS and AKS
auth:
  rootPassword: YOUR_DB_PASSWORD
  username: appuser
  password: YOUR_DB_PASSWORD
  database: appdb

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"
